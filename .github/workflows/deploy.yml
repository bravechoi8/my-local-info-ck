name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 22 * * *'  # 매일 한국 시간 오전 7시 17분 (UTC 22시 17분) 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Next.js 빌드 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # 패키지 매니저의 package-lock.json 파일이 바뀔 때 또는 소스코드 해시가 바뀔 때 캐시를 업데이트함
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 패키지 설치
        run: npm ci



      - name: 네이버 뉴스 수집 및 블로그 글 자동 생성
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-naver-news.js
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: 변경사항 커밋 및 푸시
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "자동 업데이트: 공공데이터 수집 및 블로그 글 생성"
            git push
          else
            echo "변경사항 없음. 커밋 생략."
          fi

      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: G-QLKH2QVV1E
          NEXT_PUBLIC_ADSENSE_ID: ca-pub-3945445534439467
          NEXT_PUBLIC_COUPANG_PARTNER_ID: 나중에_입력

      - name: Functions 폴더를 out 폴더 내부로 복사 (Pages Functions 동기화용)
        run: cp -r functions out/functions

      - name: Cloudflare Pages 배포
        run: npx wrangler pages deploy out --project-name=my-local-info-ck
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
