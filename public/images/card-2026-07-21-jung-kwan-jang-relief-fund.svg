
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130C25" />
      <stop offset="100%" stop-color="#201435" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <g clip-path="url(#leftClip)">
      <image href="/images/card-bg-2026-07-21-jung-kwan-jang-relief-fund.jpg" width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#3C285C" stroke-width="1.5" />

    <g transform="translate(600, 80)">
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#334155" stroke="#3C285C" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#C084FC" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#C084FC">2026-07-21</text>
      </g>

      <!-- 우측 타이틀 (글자 수 기준 완전 분할) -->
      <g transform="translate(0, 80)">
        <text y="0" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">놓치면 후회하는 고유가</text>
        <text y="48" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">피해지원금 혜택과 정관장</text>
        <text y="96" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">여름철 할인 프로모션</text>
      </g>

      <line x1="0" y1="234" x2="500" y2="234" stroke="#3C285C" stroke-width="2" />

      <text y="284" font-family="'Pretendard', sans-serif" font-size="20" fill="#F5F3FF" font-weight="700">고유가 피해지원금 지급으로 활력을 되찾은 지역 </text>
      <text y="319" font-family="'Pretendard', sans-serif" font-size="20" fill="#F5F3FF" font-weight="700">상권 소식과 함께 여름철 건강을 지키는 정관장의</text>
      
      <text y="620" font-family="'Pretendard', sans-serif" font-size="16" fill="#C084FC" font-weight="800" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
