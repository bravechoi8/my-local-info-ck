
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <!-- 우측 배경용 그라데이션 -->
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130C25" />
      <stop offset="100%" stop-color="#201435" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <!-- 왼쪽: AI 이미지 -->
    <g clip-path="url(#leftClip)">
      <image href="/images/card-bg-2026-07-21-jung-kwan-jang-relief-fund.jpg" width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <!-- 오른쪽: 텍스트 영역 -->
    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#3C285C" stroke-width="1.5" />

    <!-- 우측 텍스트 콘텐츠 -->
    <g transform="translate(600, 100)">
      <!-- 뱃지 -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#334155" stroke="#3C285C" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#C084FC" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#C084FC">2026-07-21</text>
      </g>

      <!-- 제목 (안 잘리게 30px 최적 폰트 적용) -->
      <text y="120" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F5F3FF">놓치면 후회하는 고유가 피해지원금 혜택과 정관장 여름철</text>
      <text y="170" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F5F3FF">할인 프로모션 현명하게 활용하는 방법 총정리</text>

      <!-- 구분선 -->
      <line x1="0" y1="230" x2="500" y2="230" stroke="#3C285C" stroke-width="2" />

      <!-- 설명문 (안 잘리게 최적화) -->
      <text y="280" font-family="'Pretendard', sans-serif" font-size="18" fill="#F5F3FF" font-weight="700">고유가 피해지원금 지급으로 활력을 되찾은 지역 상권 소식과</text>
      <text y="315" font-family="'Pretendard', sans-serif" font-size="18" fill="#F5F3FF" font-weight="700"> 함께 여름철 건강을 지키는 정관장의 파격적인 할인 혜택 및 실전 활용 꿀팁을 상세히 전해드립니다</text>
      
      <!-- 하단 데코 문구 -->
      <text y="600" font-family="'Pretendard', sans-serif" font-size="16" fill="#C084FC" font-weight="800" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
