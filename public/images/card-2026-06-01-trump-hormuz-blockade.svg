<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#90A4AE" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="50" y="50" width="1100" height="575" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />
  <g transform="translate(100, 110)">
    <rect x="0" y="-30" width="100" height="36" rx="18" fill="#FFCDD2" />
    <text x="50" y="-6" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#C62828" text-anchor="middle">국제 정세</text>
    <text x="0" y="50" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#263238">트럼프 호르무즈 역봉쇄 해제 선언</text>
    <text x="0" y="85" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="18" fill="#546E7A">중동 긴장 완화와 국제 유가에 미칠 영향 및 실생활 대처 팁</text>
  </g>
  <!-- Stylized Strait/Oil barrel graphic -->
  <g transform="translate(600, 360)">
    <!-- Sea lane lines -->
    <path d="M -400,0 C -200,-50 0,50 200,-20 C 300,-50 400,-10 500,-20" fill="none" stroke="#B0BEC5" stroke-width="8" stroke-dasharray="10 10" />
    <path d="M -400,-100 C -200,-150 0,-50 200,-120 C 300,-150 400,-110 500,-120" fill="none" stroke="#37474F" stroke-width="12" />
    <path d="M -400,100 C -200,50 0,150 200,80 C 300,50 400,90 500,80" fill="none" stroke="#37474F" stroke-width="12" />
    <!-- Oil ship -->
    <rect x="-80" y="-30" width="160" height="40" rx="10" fill="#546E7A" />
    <rect x="-40" y="-50" width="80" height="20" fill="#37474F" />
    <!-- Oil Barrel Icon -->
    <g transform="translate(250, -20)">
      <rect x="-40" y="-60" width="80" height="100" rx="10" fill="#263238" />
      <ellipse cx="0" cy="-60" rx="40" ry="15" fill="#37474F" />
      <ellipse cx="0" cy="40" rx="40" ry="15" fill="#263238" />
      <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#FFFFFF" stroke-width="4" />
      <text x="0" y="3" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">OIL</text>
    </g>
    <!-- USA & Iran abstract markers -->
    <circle cx="-250" cy="-100" r="30" fill="#0D47A1" />
    <text x="-250" y="-95" font-family="'Inter', sans-serif" font-weight="900" fill="#FFFFFF" font-size="16" text-anchor="middle">USA</text>
    <circle cx="-150" cy="80" r="30" fill="#1B5E20" />
    <text x="-150" y="85" font-family="'Inter', sans-serif" font-weight="900" fill="#FFFFFF" font-size="16" text-anchor="middle">IRAN</text>
  </g>
</svg>
