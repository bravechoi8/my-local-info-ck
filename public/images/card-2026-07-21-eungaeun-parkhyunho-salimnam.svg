    </clipPath>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1016" />
      <stop offset="100%" stop-color="#2A1A24" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <g clip-path="url(#leftClip)">
      <image href="/images/card-bg-2026-07-21-eungaeun-parkhyunho-salimnam.jpg" width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#4D3647" stroke-width="1.5" />

    <g transform="translate(600, 80)">
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#334155" stroke="#4D3647" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FB7185" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#FDA4AF">2026-07-22</text>
      </g>

      <!-- 우측 타이틀 (글자 수 기준 완전 분할) -->
      <g transform="translate(0, 80)">
        <text y="0" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#FFF1F2">은가은 박현호 신혼 일상</text>
        <text y="48" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#FFF1F2">최초 공개 살림남 합류</text>
        <text y="96" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#FFF1F2">소식과 트로트 연상연하</text>
      </g>

      <line x1="0" y1="234" x2="500" y2="234" stroke="#4D3647" stroke-width="2" />

      <text y="284" font-family="'Pretendard', sans-serif" font-size="20" fill="#FFF1F2" font-weight="700">트로트 스타 은가은과 박현호 부부가 살림남2에 </text>
      <text y="319" font-family="'Pretendard', sans-serif" font-size="20" fill="#FFF1F2" font-weight="700">합류하여 달콤하고 유쾌한 신혼 생활을 전격 공개</text>
      
