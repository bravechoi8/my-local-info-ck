
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1016" />
      <stop offset="100%" stop-color="#2A1A24" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mainBg)" />

  <g transform="translate(50, 30)">
    <rect width="105" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FB7185" text-anchor="middle">REAL INFO</text>
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#FDA4AF">2026-07-26</text>
  </g>

  <!-- 메인 타이틀 (글자 수 기준 18자 강제 줄바꿈으로 절대 안 잘림) -->
  <g transform="translate(50, 80)">
    <text y="0" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFF1F2">내 보험료 줄이고 보장은 탄탄하게</text>
    <text y="42" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFF1F2">교보라이프플래닛 AI 보험비서</text>
    <text y="84" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFF1F2">활용법 총정리</text>
  </g>

  <!-- 이미지 영영 -->
  <g>
    <clipPath id="imageClip">
      <rect x="50" y="215" width="1100" height="270" rx="16" />
    </clipPath>
    <rect x="50" y="215" width="1100" height="270" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
    <image href="data:image/jpeg;base64," x="50" y="215" width="1100" height="270" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- 하단 3칸 카드 (빅 폰트 적용) -->
  <g>
    
      <!-- Card 1 -->
      <g transform="translate(50, 515)">
        <rect width="340" height="240" rx="18" fill="#3F2D3A" stroke="#4D3647" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#FB7185" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#FB7185" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFF1F2">맞춤형 분석</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#4D3647" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">연령과 습관</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">완벽한 분석</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(430, 515)">
        <rect width="340" height="240" rx="18" fill="#3F2D3A" stroke="#4D3647" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#10B981" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFF1F2">보험료 절감</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#4D3647" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">불필요 지출</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">확 줄여줘요</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(810, 515)">
        <rect width="340" height="240" rx="18" fill="#3F2D3A" stroke="#4D3647" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#38BDF8" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFF1F2">AI 비서</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#4D3647" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">스마트하게</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFF1F2" font-weight="800" letter-spacing="-0.5px">보장 설계해</text>
      </g>
      
  </g>
</svg>
