
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <linearGradient id="textOverlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="45%" stop-color="rgba(0,0,0,0.45)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.9)" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <image href="data:image/jpeg;base64," width="1200" height="800" preserveAspectRatio="xMidYMid slice" />
    <rect y="350" width="1200" height="450" fill="url(#textOverlayGrad)" />

    <g transform="translate(60, 60)">
      <rect width="105" height="26" rx="13" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
      <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">REAL INFO</text>
      <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F5F3FF" fill-opacity="0.8">2026-08-05</text>
    </g>

    <!-- 하단 멀티라인 타이틀 (잘림 방지) -->
    <g transform="translate(60, 595)">
      <text y="0" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#F5F3FF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">초등학생 주식 투자 조기 교육법 어린이</text>
      <text y="46" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#F5F3FF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">재테크 시작 시 이것만은 꼭 주의하세요</text>
      <text y="107" font-family="'Pretendard', sans-serif" font-size="20" fill="#C084FC" font-weight="700" filter="drop-shadow(0px 2px 5px rgba(0,0,0,0.8))">아이를 위한 올바른 주식 투자 교육</text>
    </g>
  </g>
</svg>
