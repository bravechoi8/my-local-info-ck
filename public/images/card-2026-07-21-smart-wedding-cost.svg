
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#mainBg)" />

  <!-- HEADER AREA -->
  <g transform="translate(50, 45)">
    <rect width="105" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle">REAL INFO</text>
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#52525B">2026-07-21</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="110" font-family="'Pretendard', sans-serif" font-size="42" font-weight="900" fill="#18181B">치솟는 결혼 비용 줄이는 비법 한국소비자원이 공개한 전국 예식장 스드메 가격 비교 포털 활용법 총정리</text>
  
  <!-- Subtitle -->
  <text x="50" y="145" font-family="'Pretendard', sans-serif" font-size="20" fill="#52525B" font-weight="600">한국소비자원이 거품 없는 결혼식을 위해 전국 예식장 및 스드메 가격 정보를 상시 개방하는 포털 시스템을 구축해 스마트한 비용 절감 트렌드를 제안합니다.</text>

  <!-- CENTRAL GRAPHIC (AI Image Frame) -->
  <g>
    <clipPath id="imageClip">
      <rect x="50" y="170" width="1100" height="325" rx="16" />
    </clipPath>
    <rect x="50" y="170" width="1100" height="325" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <image href="/images/card-bg-2026-07-21-smart-wedding-cost.jpg" x="50" y="170" width="1100" height="325" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
    <rect x="50" y="170" width="1100" height="325" rx="16" fill="none" stroke="#18181B" stroke-width="1" opacity="0.1" />
  </g>

  <!-- BOTTOM THREE CARDS -->
  <g>
    
      <!-- Card 1 -->
      <g transform="translate(50, 530)">
        <rect width="340" height="220" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2" />
        <path d="M 16 0 L 324 0" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
        <circle cx="45" cy="45" r="20" fill="#D97706" />
        <text x="45" y="52" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="80" y="53" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#18181B">핵심 혜택 안내</text>
        <line x1="25" y1="85" x2="315" y2="85" stroke="#E4E4E7" stroke-width="1.5" />
        <text x="25" y="132" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">치솟는 결혼 비용 줄이는 </text>
        <text x="25" y="170" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">상세 가이드 확인</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(430, 530)">
        <rect width="340" height="220" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2" />
        <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="5" stroke-linecap="round" />
        <circle cx="45" cy="45" r="20" fill="#10B981" />
        <text x="45" y="52" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="80" y="53" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#18181B">알뜰 이용 팁</text>
        <line x1="25" y1="85" x2="315" y2="85" stroke="#E4E4E7" stroke-width="1.5" />
        <text x="25" y="132" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">한국소비자원이 거품 없는 </text>
        <text x="25" y="170" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">실시간 정보 제공</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(810, 530)">
        <rect width="340" height="220" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
        <circle cx="45" cy="45" r="20" fill="#38BDF8" />
        <text x="45" y="52" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="80" y="53" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#18181B">스마트 활용법</text>
        <line x1="25" y1="85" x2="315" y2="85" stroke="#E4E4E7" stroke-width="1.5" />
        <text x="25" y="132" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">놓치면 손해보는</text>
        <text x="25" y="170" font-family="'Pretendard', sans-serif" font-size="19" fill="#18181B" font-weight="700">꿀팁 총정리</text>
      </g>
      
  </g>
</svg>
