
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mainBg)" />

  <g transform="translate(50, 30)">
    <rect width="105" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">REAL INFO</text>
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#A1A1AA">2026-07-22</text>
  </g>

  <!-- 메인 타이틀 (글자 수 기준 18자 강제 줄바꿈으로 절대 안 잘림) -->
  <g transform="translate(50, 80)">
    <text y="0" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F4F4F5">배우 고소영 30년지기 절친이 눈물</text>
    <text y="42" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F4F4F5">흘리며 고백한 미담의 진실과 반전</text>
    <text y="84" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#F4F4F5">매력 총정리</text>
  </g>

  <!-- 이미지 영영 -->
  <g>
    <clipPath id="imageClip">
      <rect x="50" y="215" width="1100" height="270" rx="16" />
    </clipPath>
    <rect x="50" y="215" width="1100" height="270" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
    <image href="/images/card-bg-2026-07-21-holiday-hospital-pharmacy.jpg" x="50" y="215" width="1100" height="270" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- 하단 3칸 카드 (빅 폰트 적용) -->
  <g>
    
      <!-- Card 1 -->
      <g transform="translate(50, 515)">
        <rect width="340" height="240" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#FBBF24" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#F4F4F5">대란 이슈 정보</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#3F3F46" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">실시간 핫이슈 정보</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="19" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">인기 관심사 집중분석</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(430, 515)">
        <rect width="340" height="240" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#10B981" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#F4F4F5">갓성비 스타일</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#3F3F46" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">주목할 만한 트렌드</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">화제의 비하인드</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(810, 515)">
        <rect width="340" height="240" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#38BDF8" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#F4F4F5">놓치면 아쉬운 팁</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#3F3F46" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">가성비 꿀팁 대방출</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#F4F4F5" font-weight="800" letter-spacing="-0.5px">추천 정보 총정리</text>
      </g>
      
  </g>
</svg>
