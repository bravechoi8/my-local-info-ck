
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <!-- 우측 배경용 그라데이션 -->
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <!-- 왼쪽: AI 이미지 -->
    <g clip-path="url(#leftClip)">
      <image href="/images/card-bg-2026-07-21-overseas-travel-roaming.jpg" width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <!-- 오른쪽: 텍스트 영역 -->
    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- 우측 텍스트 콘텐츠 -->
    <g transform="translate(600, 100)">
      <!-- 뱃지 -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#475569">2026-07-21</text>
      </g>

      <!-- 제목 (2줄 자동 분할) -->
      <text y="140" font-family="'Pretendard', sans-serif" font-size="42" font-weight="900" fill="#1E293B">KT 동남아 알뜰로밍 출시! 그랩 10만원 할인</text>
      <text y="210" font-family="'Pretendard', sans-serif" font-size="42" font-weight="900" fill="#1E293B">혜택받고 가성비 해외여행 준비하는 법 총정리</text>

      <!-- 구분선 -->
      <line x1="0" y1="285" x2="500" y2="285" stroke="#E2E8F0" stroke-width="2.5" />

      <!-- 설명문 -->
      <text y="345" font-family="'Pretendard', sans-serif" font-size="22" fill="#1E293B" font-weight="700">KT가 동남아 여행객을 겨냥해 출시한 알뜰로밍 요금제의 상세 스펙과 그랩 최대 10만 원 할인 혜택 정보 및 알뜰한 해외여행 준비 팁을 정리해 드립니다.</text>
      
      <!-- 하단 데코 문구 -->
      <text y="600" font-family="'Pretendard', sans-serif" font-size="16" fill="#0284C7" font-weight="800" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
