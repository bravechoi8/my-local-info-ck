<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1" />
      <stop offset="100%" stop-color="#B2DFDB" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg)" />
  <!-- Calculator Icon -->
  <g transform="translate(250, 225)">
    <rect x="-100" y="-120" width="200" height="240" rx="16" fill="#004D40" />
    <rect x="-80" y="-100" width="160" height="50" rx="8" fill="#E0F2F1" />
    <text x="60" y="-65" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#004D40" text-anchor="end">1,000,000,000</text>
    <!-- Buttons -->
    <rect x="-80" y="-30" width="40" height="30" rx="4" fill="#80CBC4" />
    <rect x="-20" y="-30" width="40" height="30" rx="4" fill="#80CBC4" />
    <rect x="40" y="-30" width="40" height="30" rx="4" fill="#80CBC4" />
    <rect x="-80" y="20" width="40" height="30" rx="4" fill="#80CBC4" />
    <rect x="-20" y="20" width="40" height="30" rx="4" fill="#80CBC4" />
    <rect x="40" y="20" width="40" height="30" rx="4" fill="#FF8F00" />
    <text x="60" y="42" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">=</text>
  </g>
  <!-- Text Label -->
  <g transform="translate(480, 200)">
    <text x="0" y="0" font-family="'Noto Sans KR', sans-serif" font-size="32" font-weight="900" fill="#004D40">환산보증금 계산법</text>
    <text x="0" y="45" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#00796B">보증금 + (월세 × 100)</text>
    <text x="0" y="85" font-family="'Noto Sans KR', sans-serif" font-size="16" fill="#004D40">예: 보증금 5억 + (월세 500만 × 100) = 10억</text>
  </g>
</svg>
