
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <linearGradient id="textOverlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="45%" stop-color="rgba(0,0,0,0.45)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.9)" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <image href="/images/card-bg-2026-07-21-debit-card-trends.jpg" width="1200" height="800" preserveAspectRatio="xMidYMid slice" />
    <rect y="350" width="1200" height="450" fill="url(#textOverlayGrad)" />

    <g transform="translate(60, 60)">
      <rect width="105" height="26" rx="13" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
      <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">REAL INFO</text>
      <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#FFF1F2" fill-opacity="0.8">2026-07-21</text>
    </g>

    <!-- 하단 멀티라인 타이틀 (잘림 방지) -->
    <g transform="translate(60, 550)">
      <text y="0" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#FFF1F2" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">혜택 좋은 혜자 체크카드 단종 대란 속</text>
      <text y="46" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#FFF1F2" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">살아남은 트래블카드 비교와 현명한 소비</text>
      <text y="92" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#FFF1F2" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">방법 총정리</text>
      <text y="153" font-family="'Pretendard', sans-serif" font-size="20" fill="#FDA4AF" font-weight="700" filter="drop-shadow(0px 2px 5px rgba(0,0,0,0.8))">혜자 체크카드가 연이어 자취를 감추는 흐름 속에서 트래블카드의 독주 원인과 금융 소비자를 위한 생존 전략을 분석합니다.</text>
    </g>
  </g>
</svg>
