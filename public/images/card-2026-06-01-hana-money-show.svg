<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#81C784" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="50" y="50" width="1100" height="575" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />
  <g transform="translate(100, 110)">
    <rect x="0" y="-30" width="100" height="36" rx="18" fill="#A5D6A7" />
    <text x="50" y="-6" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2E7D32" text-anchor="middle">재테크</text>
    <text x="0" y="50" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#1B5E20">제1회 하나금융그룹 통합 머니쇼</text>
    <text x="0" y="85" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="18" fill="#4E342E">개별 상품 설명회를 넘어선 종합 자산관리 세미나 총정리</text>
  </g>
  <!-- Stylized money show chart & coins -->
  <g transform="translate(600, 360)">
    <!-- Growth chart line -->
    <path d="M -300,100 L -100,50 L 100,-50 L 300,-150" fill="none" stroke="#2E7D32" stroke-width="8" />
    <circle cx="-300" cy="100" r="12" fill="#2E7D32" />
    <circle cx="-100" cy="50" r="12" fill="#2E7D32" />
    <circle cx="100" cy="-50" r="12" fill="#2E7D32" />
    <circle cx="300" cy="-150" r="16" fill="#D84315" />
    <!-- Piggy bank or gold coin stacks -->
    <g transform="translate(-150, 120)">
      <rect x="-30" y="-20" width="60" height="15" rx="5" fill="#FFD54F" />
      <rect x="-30" y="-5" width="60" height="15" rx="5" fill="#FFCA28" />
      <rect x="-30" y="10" width="60" height="15" rx="5" fill="#FFB300" />
      <text x="0" y="2" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#FF8F00" text-anchor="middle">₩</text>
    </g>
    <g transform="translate(150, 60)">
      <rect x="-35" y="-30" width="70" height="20" rx="5" fill="#FFD54F" />
      <rect x="-35" y="-10" width="70" height="20" rx="5" fill="#FFCA28" />
      <rect x="-35" y="10" width="70" height="20" rx="5" fill="#FFB300" />
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FF8F00" text-anchor="middle">₩</text>
    </g>
    <!-- Card visual symbols -->
    <g transform="translate(300, -50)">
      <circle cx="0" cy="0" r="50" fill="#FFF8E1" stroke="#FFD54F" stroke-width="4" />
      <text x="0" y="12" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="36" font-weight="900" fill="#FF8F00" text-anchor="middle">★</text>
    </g>
  </g>
</svg>
