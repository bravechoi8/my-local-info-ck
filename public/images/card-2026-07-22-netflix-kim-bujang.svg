
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mainBg)" />

  <g transform="translate(50, 30)">
    <rect width="105" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="middle">REAL INFO</text>
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#0369A1">2026-07-22</text>
  </g>

  <!-- 메인 타이틀 (글자 수 기준 18자 강제 줄바꿈으로 절대 안 잘림) -->
  <g transform="translate(50, 80)">
    <text y="0" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0C4A6E">넷플릭스 김부장 3주 연속 1위</text>
    <text y="42" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0C4A6E">신화 동궁 아파트까지 K콘텐츠</text>
    <text y="84" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#0C4A6E">몰아보기 총정리</text>
  </g>

  <!-- 이미지 영영 -->
  <g>
    <clipPath id="imageClip">
      <rect x="50" y="215" width="1100" height="270" rx="16" />
    </clipPath>
    <rect x="50" y="215" width="1100" height="270" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <image href="/images/card-bg-2026-07-21-holiday-hospital-pharmacy.jpg" x="50" y="215" width="1100" height="270" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- 하단 3칸 카드 (빅 폰트 적용) -->
  <g>
    
      <!-- Card 1 -->
      <g transform="translate(50, 515)">
        <rect width="340" height="240" rx="18" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#0284C7" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#0C4A6E">넷플릭스 1위</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#BAE6FD" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">김부장 신드롬 돌풍</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">비영어권 3주 연속</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(430, 515)">
        <rect width="340" height="240" rx="18" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#10B981" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#0C4A6E">인기 K콘텐츠</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#BAE6FD" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">동궁 아파트 후속작</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">흥행 몰이 비결분석</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(810, 515)">
        <rect width="340" height="240" rx="18" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#38BDF8" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#0C4A6E">정주행 꿀팁 안내</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#BAE6FD" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">놓치면 아쉬운 추천</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#0C4A6E" font-weight="800" letter-spacing="-0.5px">넷플릭스 강력 추천</text>
      </g>
      
  </g>
</svg>
