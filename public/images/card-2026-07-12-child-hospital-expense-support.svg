
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <linearGradient id="textOverlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="45%" stop-color="rgba(0,0,0,0.45)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.9)" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <image href="/images/card-bg-2026-07-12-child-hospital-expense-support.jpg" width="1200" height="800" preserveAspectRatio="xMidYMid slice" />
    <rect y="350" width="1200" height="450" fill="url(#textOverlayGrad)" />

    <g transform="translate(60, 60)">
      <rect width="105" height="26" rx="13" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
      <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">REAL INFO</text>
      <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F5F3FF" fill-opacity="0.8">2026-07-21</text>
    </g>

    <!-- 하단 멀티라인 타이틀 (잘림 방지) -->
    <g transform="translate(60, 550)">
      <text y="0" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#F5F3FF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">아동 입원 진료비 지원 혜택 신청 방법</text>
      <text y="46" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#F5F3FF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">및 대상 총정리 만 15세 이하 의료비</text>
      <text y="92" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" fill="#F5F3FF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">본인부담금 줄이는 꿀팁</text>
      <text y="153" font-family="'Pretendard', sans-serif" font-size="20" fill="#C084FC" font-weight="700" filter="drop-shadow(0px 2px 5px rgba(0,0,0,0.8))">만 15세 이하 자녀의 입원 진료비 본인부담금을 전액 또는 일부 지원받아 가계의 의료비 부담을 획기적으로 낮출 수 있는 보건복지부 복지 서비스를 상세히 공유합니다.</text>
    </g>
  </g>
</svg>
