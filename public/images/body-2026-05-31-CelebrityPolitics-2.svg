<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EAF6" />
      <stop offset="100%" stop-color="#C5CAE9" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg)" />
  <!-- Handshake or diverse people icon -->
  <g transform="translate(200, 225)">
    <circle cx="-50" cy="0" r="50" fill="#3F51B5" />
    <circle cx="50" cy="0" r="50" fill="#E91E63" />
    <!-- Overlapping area with heart -->
    <path d="M 0,-20 C 0,-20 10,-35 25,-20 C 40,-5 0,30 0,30 C 0,30 -40,-5 -25,-20 C -10,-35 0,-20 0,-20 Z" fill="#FFFFFF" />
  </g>
  <!-- Text Label -->
  <g transform="translate(400, 180)">
    <text x="0" y="0" font-family="'Noto Sans KR', sans-serif" font-size="32" font-weight="900" fill="#1A237E">대중의 성숙한 자세</text>
    <text x="0" y="50" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#283593">1. 아티스트의 시민권 존중</text>
    <text x="0" y="90" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#283593">2. 의견 다양성의 인정</text>
    <text x="0" y="130" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#283593">3. 무조건적 비난 지양</text>
  </g>
</svg>
