<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5" />
      <stop offset="100%" stop-color="#E1BEE7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8E24AA" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="50" y="50" width="1100" height="575" rx="24" fill="#FFFFFF" filter="url(#shadow)" />
  <g transform="translate(100, 110)">
    <rect x="0" y="-30" width="100" height="36" rx="18" fill="#E1BEE7" />
    <text x="50" y="-6" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#7B1FA2" text-anchor="middle">연예인 이슈</text>
    <text x="0" y="50" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#311B92">연예인 소신 발언과 대중의 반응</text>
    <text x="0" y="85" font-family="'Inter', 'Noto Sans KR', sans-serif" font-size="18" fill="#4A148C">표현의 자유와 사회적 책임, 대중 문화 속 정치색 논란을 보는 성숙한 시선</text>
  </g>
  <!-- Balance scale & speech bubble graphic -->
  <g transform="translate(600, 360)">
    <!-- Scale -->
    <line x1="-150" y1="80" x2="150" y2="80" stroke="#311B92" stroke-width="8" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#311B92" stroke-width="8" />
    <line x1="-100" y1="-40" x2="100" y2="-40" stroke="#311B92" stroke-width="8" />
    <!-- Left Scale Plate (Freedom) -->
    <line x1="-100" y1="-40" x2="-140" y2="20" stroke="#7B1FA2" stroke-width="4" />
    <line x1="-100" y1="-40" x2="-60" y2="20" stroke="#7B1FA2" stroke-width="4" />
    <rect x="-160" y="20" width="120" height="15" rx="5" fill="#E1BEE7" />
    <text x="-100" y="50" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#311B92" text-anchor="middle">표현의 자유</text>
    <!-- Right Scale Plate (Responsibility) -->
    <line x1="100" y1="-40" x2="60" y2="20" stroke="#7B1FA2" stroke-width="4" />
    <line x1="100" y1="-40" x2="140" y2="20" stroke="#7B1FA2" stroke-width="4" />
    <rect x="40" y="20" width="120" height="15" rx="5" fill="#E1BEE7" />
    <text x="100" y="50" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#311B92" text-anchor="middle">사회적 책임</text>
  </g>
</svg>
