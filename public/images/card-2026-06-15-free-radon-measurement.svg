
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <!-- 우측 배경용 그라데이션 -->
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <!-- 왼쪽: AI 이미지 -->
    <g clip-path="url(#leftClip)">
      <image href="data:image/jpeg;base64," width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <!-- 오른쪽: 텍스트 영역 -->
    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#E4E4E7" stroke-width="1.5" />

    <!-- 우측 텍스트 콘텐츠 -->
    <g transform="translate(600, 100)">
      <!-- 뱃지 -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#52525B">2026-06-15</text>
      </g>

      <!-- 제목 (2줄 자동 분할) -->
      <text y="140" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#18181B">우리 집 공기 속 침묵의 살인자 라돈</text>
      <text y="205" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#18181B">무료로 측정하고 해결하는 법 총정리</text>

      <!-- 구분선 -->
      <line x1="0" y1="285" x2="500" y2="285" stroke="#E4E4E7" stroke-width="2" />

      <!-- 설명문 -->
      <text y="340" font-family="'Pretendard', sans-serif" font-size="18" fill="#52525B" font-weight="500">라돈 걱정 끝! 무료 측정법</text>
      
      <!-- 하단 데코 문구 -->
      <text y="600" font-family="'Pretendard', sans-serif" font-size="15" fill="#D97706" font-weight="700" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
