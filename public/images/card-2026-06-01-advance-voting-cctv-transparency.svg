
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#mainBg)" />

  <!-- HEADER AREA -->
  <g transform="translate(50, 45)">
    <!-- Site Badge -->
    <rect width="105" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">REAL INFO</text>
    
    <!-- Publish Date -->
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#64748B">2026-06-01</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="110" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">우리 동네 사전투표함 선관위 CCTV 영상 누구나 볼 수 있대요</text>
  
  <!-- Subtitle -->
  <text x="50" y="142" font-family="'Pretendard', sans-serif" font-size="16" fill="#94A3B8" font-weight="500">사전투표함 CCTV, 국민 감시</text>

  <!-- CENTRAL GRAPHIC (AI Image Frame) -->
  <g>
    <!-- Rounded Clip Path for AI Image -->
    <clipPath id="imageClip">
      <rect x="50" y="170" width="1100" height="325" rx="16" />
    </clipPath>
    
    <!-- Image Card Frame background -->
    <rect x="50" y="170" width="1100" height="325" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
    
    <!-- AI Generated Background Image -->
    <image href="/images/card-bg-2026-06-01-advance-voting-cctv-transparency.jpg" x="50" y="170" width="1100" height="325" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
    
    <!-- Glassmorphism Overlay -->
    <rect x="50" y="170" width="1100" height="325" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1" />
  </g>

  <!-- BOTTOM THREE CARDS -->
  <g>
    
    <!-- Card 1 -->
    <g transform="translate(50, 530)">
      <!-- Card Box -->
      <rect width="340" height="220" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      
      <!-- Top Line Indicator -->
      <path d="M 16 0 L 324 0" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      
      <!-- Number Circle -->
      <circle cx="45" cy="45" r="16" fill="#F59E0B" />
      <text x="45" y="50" font-family="'Pretendard', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
      
      <!-- Card Title -->
      <text x="75" y="51" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">선관위 발표</text>
      
      <!-- Divider -->
      <line x1="25" y1="85" x2="315" y2="85" stroke="#334155" stroke-width="1" />
      
      <!-- Card Descriptions -->
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">사전투표함 보관</text>
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">CCTV 영상 공개</text>
    </g>
    
    <!-- Card 2 -->
    <g transform="translate(430, 530)">
      <!-- Card Box -->
      <rect width="340" height="220" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      
      <!-- Top Line Indicator -->
      <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
      
      <!-- Number Circle -->
      <circle cx="45" cy="45" r="16" fill="#10B981" />
      <text x="45" y="50" font-family="'Pretendard', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
      
      <!-- Card Title -->
      <text x="75" y="51" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">열람 가능</text>
      
      <!-- Divider -->
      <line x1="25" y1="85" x2="315" y2="85" stroke="#334155" stroke-width="1" />
      
      <!-- Card Descriptions -->
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">국민 누구나</text>
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">언제든지 확인</text>
    </g>
    
    <!-- Card 3 -->
    <g transform="translate(810, 530)">
      <!-- Card Box -->
      <rect width="340" height="220" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      
      <!-- Top Line Indicator -->
      <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
      
      <!-- Number Circle -->
      <circle cx="45" cy="45" r="16" fill="#38BDF8" />
      <text x="45" y="50" font-family="'Pretendard', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
      
      <!-- Card Title -->
      <text x="75" y="51" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">공정성 확보</text>
      
      <!-- Divider -->
      <line x1="25" y1="85" x2="315" y2="85" stroke="#334155" stroke-width="1" />
      
      <!-- Card Descriptions -->
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">지방선거 투표함</text>
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="15" fill="#94A3B8" font-weight="500">국민 참여 감시</text>
    </g>
    
  </g>
</svg>
