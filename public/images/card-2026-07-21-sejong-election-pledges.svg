
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mainBg)" />

  <g transform="translate(50, 30)">
    <rect width="105" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">REAL INFO</text>
    <text x="115" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#94A3B8">2026-07-21</text>
  </g>

  <!-- 메인 타이틀 (글자 수 기준 18자 강제 줄바꿈으로 절대 안 잘림) -->
  <g transform="translate(50, 80)">
    <text y="0" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">세종시의 미래가 바뀐다 조상호의</text>
    <text y="42" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">기본사회 vs 최민호의 가족경제</text>
    <text y="84" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">정책 대격돌과 우리 삶의 변화</text>
  </g>

  <!-- 이미지 영영 -->
  <g>
    <clipPath id="imageClip">
      <rect x="50" y="215" width="1100" height="270" rx="16" />
    </clipPath>
    <rect x="50" y="215" width="1100" height="270" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
    <image href="/images/card-bg-2026-07-21-sejong-election-pledges.jpg" x="50" y="215" width="1100" height="270" clip-path="url(#imageClip)" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- 하단 3칸 카드 (빅 폰트 적용) -->
  <g>
    
      <!-- Card 1 -->
      <g transform="translate(50, 515)">
        <rect width="340" height="240" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#38BDF8" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">핵심 혜택 안내</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#334155" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">주요 정보 한눈에</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">상세 가이드</text>
      </g>
      
      <!-- Card 2 -->
      <g transform="translate(430, 515)">
        <rect width="340" height="240" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#10B981" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">알뜰 이용 팁</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#334155" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">놓치면 손해보는</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">실시간 꿀팁</text>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(810, 515)">
        <rect width="340" height="240" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2.5" />
        <path d="M 16 0 L 324 0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="48" r="21" fill="#38BDF8" />
        <text x="45" y="55" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="82" y="56" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">스마트 활용법</text>
        <line x1="25" y1="92" x2="315" y2="92" stroke="#334155" stroke-width="1.5" />
        <text x="25" y="140" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">쉽고 빠른 이용</text>
        <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="21" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5px">핵심 정리</text>
      </g>
      
  </g>
</svg>
