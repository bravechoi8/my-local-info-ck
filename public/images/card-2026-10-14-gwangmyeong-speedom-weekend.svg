
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130C25" />
      <stop offset="100%" stop-color="#201435" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <g clip-path="url(#leftClip)">
      <image href="data:image/jpeg;base64," width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#3C285C" stroke-width="1.5" />

    <g transform="translate(600, 80)">
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#334155" stroke="#3C285C" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#C084FC" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#C084FC">2026-10-14</text>
      </g>

      <!-- 우측 타이틀 (글자 수 기준 완전 분할) -->
      <g transform="translate(0, 80)">
        <text y="0" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">아이와 가볼 만한 주말</text>
        <text y="48" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">나들이 명소 광명스피돔 문화</text>
        <text y="96" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#F5F3FF">체험 및 스포츠 프로그램</text>
      </g>

      <line x1="0" y1="234" x2="500" y2="234" stroke="#3C285C" stroke-width="2" />

      <text y="284" font-family="'Pretendard', sans-serif" font-size="20" fill="#F5F3FF" font-weight="700">아이와 함께 떠나는 나들이</text>
      
      
      <text y="620" font-family="'Pretendard', sans-serif" font-size="16" fill="#C084FC" font-weight="800" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
