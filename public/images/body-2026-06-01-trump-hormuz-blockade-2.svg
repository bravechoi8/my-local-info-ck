<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="100%" stop-color="#B3E5FC" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg)" />
  <!-- Gas Station Pump Graphic -->
  <g transform="translate(180, 220)">
    <rect x="-50" y="-80" width="100" height="160" rx="8" fill="#0277BD" />
    <rect x="-35" y="-60" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#01579B" stroke-width="2" />
    <text x="0" y="-25" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#01579B" text-anchor="middle">1,650원</text>
    <!-- Hose -->
    <path d="M 50,0 Q 80,40 50,80" fill="none" stroke="#01579B" stroke-width="8" />
  </g>
  <!-- Text Label -->
  <g transform="translate(350, 180)">
    <text x="0" y="0" font-family="'Noto Sans KR', sans-serif" font-size="30" font-weight="900" fill="#01579B">실생활 대처 팁</text>
    <text x="0" y="45" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#37474F">1. 국내 유가 변동성 모니터링</text>
    <text x="0" y="80" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#37474F">2. 글로벌 경제 뉴스 관심 갖기</text>
    <text x="0" y="115" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#37474F">3. 언론 보도 이면의 비판적 사고</text>
  </g>
</svg>
