
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <clipPath id="fullClip">
      <rect width="1200" height="800" rx="24" />
    </clipPath>
    <clipPath id="leftClip">
      <rect width="540" height="800" />
    </clipPath>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#fullClip)">
    <g clip-path="url(#leftClip)">
      <image href="data:image/jpeg;base64," width="540" height="800" preserveAspectRatio="xMidYMid slice" />
    </g>

    <rect x="540" width="660" height="800" fill="url(#splitBg)" />
    <line x1="540" y1="0" x2="540" y2="800" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(600, 80)">
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="52.5" y="17" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="middle">REAL INFO</text>
        <text x="120" y="18" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#475569">2026-10-08</text>
      </g>

      <!-- 우측 타이틀 (글자 수 기준 완전 분할) -->
      <g transform="translate(0, 80)">
        <text y="0" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#1E293B">포천 산정호수 명성산 억새꽃</text>
        <text y="48" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#1E293B">축제 일정부터 등산 코스</text>
        <text y="96" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#1E293B">주차 꿀팁까지 완벽 정리</text>
      </g>

      <line x1="0" y1="234" x2="500" y2="234" stroke="#E2E8F0" stroke-width="2" />

      <text y="284" font-family="'Pretendard', sans-serif" font-size="20" fill="#1E293B" font-weight="700">은빛 억새와 떠나는 가을 여행</text>
      
      
      <text y="620" font-family="'Pretendard', sans-serif" font-size="16" fill="#0284C7" font-weight="800" letter-spacing="1">TODAY'S SPECIAL ISSUE</text>
    </g>
  </g>
</svg>
