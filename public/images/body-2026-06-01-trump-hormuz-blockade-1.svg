<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBEE" />
      <stop offset="100%" stop-color="#FFCDD2" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg)" />
  <!-- Oil Tanker Graphic -->
  <g transform="translate(180, 220)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#37474F" />
    <polygon points="-80,-30 -60,-70 20,-70 40,-30" fill="#78909C" />
    <!-- Ship chimney -->
    <rect x="60" y="-60" width="20" height="30" fill="#263238" />
    <!-- Smoke -->
    <circle cx="70" cy="-80" r="10" fill="#B0BEC5" opacity="0.6" />
    <circle cx="85" cy="-95" r="15" fill="#B0BEC5" opacity="0.4" />
  </g>
  <!-- Text Label -->
  <g transform="translate(380, 180)">
    <text x="0" y="0" font-family="'Noto Sans KR', sans-serif" font-size="30" font-weight="900" fill="#C62828">호르무즈 해협의 역할</text>
    <text x="0" y="45" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#37474F">전 세계 해상 석유 수송량의 20% 통과</text>
    <text x="0" y="80" font-family="'Noto Sans KR', sans-serif" font-size="16" fill="#546E7A">산유국의 원유가 글로벌 시장으로 흐르는 길목</text>
    <text x="0" y="110" font-family="'Noto Sans KR', sans-serif" font-size="16" fill="#C62828" font-weight="700">⚠️ 분쟁 발생 시 국제 유가 급등 초래</text>
  </g>
</svg>
