<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테토-에겐 성격 유형 테스트 · teto-egen-test.me</title>
<meta name="description" content="호르몬 기반 성격 유형 테스트. 12개 질문으로 알아보는 나의 진짜 성향 — 테토남, 에겐남, 테토녀, 에겐녀.">
<meta name="theme-color" content="#fdfaf6">
<meta property="og:title" content="테토-에겐 성격 유형 테스트">
<meta property="og:description" content="나는 테토일까, 에겐일까? 12개 질문으로 알아보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teto-egen-test.me">
<meta property="og:site_name" content="teto-egen-test.me">
<meta name="twitter:card" content="summary">
<style>
  /* ===== 라이트 모드 (기본) ===== */
  :root,
  [data-theme="light"] {
    --bg: #fdfaf6;
    --card: #ffffff;
    --ink: #2b2722;
    --ink-muted: #7a7268;
    --line: #ebe4d9;
    --line-strong: #d4ccbe;
    --teto: #d85a30;
    --teto-soft: #faece7;
    --teto-deep: #993c1d;
    --teto-grad-a: #faece7;
    --teto-grad-b: #f5c4b3;
    --egen: #7f77dd;
    --egen-soft: #eeedfe;
    --egen-deep: #3c3489;
    --egen-grad-a: #eeedfe;
    --egen-grad-b: #cecbf6;
    --accent: #1d1d1b;
    --accent-text: #ffffff;
    --hover-bg: #fbf8f3;
    --shadow-sm: 0 2px 8px rgba(40, 30, 20, 0.04);
    --shadow-md: 0 8px 24px rgba(40, 30, 20, 0.08);
  }

  /* ===== 다크 모드 ===== */
  [data-theme="dark"] {
    --bg: #1a1714;
    --card: #25211d;
    --ink: #f0ebe3;
    --ink-muted: #9a9085;
    --line: #3a342d;
    --line-strong: #4a423a;
    --teto: #f29978;
    --teto-soft: #4a1f12;
    --teto-deep: #f5c4b3;
    --teto-grad-a: #4a1f12;
    --teto-grad-b: #6b2d18;
    --egen: #b5afef;
    --egen-soft: #2a2456;
    --egen-deep: #cecbf6;
    --egen-grad-a: #2a2456;
    --egen-grad-b: #3c3489;
    --accent: #f0ebe3;
    --accent-text: #1a1714;
    --hover-bg: #2e2924;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  /* ===== 상단 컨트롤바 (브랜드 + 테마 + 언어) ===== */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--teto), var(--egen));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .brand-domain {
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 12px;
    margin-left: 2px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .icon-btn:hover {
    border-color: var(--ink);
    transform: translateY(-1px);
  }

  .icon-btn svg {
    width: 14px;
    height: 14px;
  }

  /* ===== 공통 화면 컨테이너 ===== */
  .screen {
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    padding: 36px 28px;
    animation: fadeIn 0.35s ease;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }

  /* ===== 인트로 ===== */
  .intro-tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .intro-title {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }

  .intro-title .gradient {
    background: linear-gradient(90deg, var(--teto), var(--egen));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .intro-desc {
    color: var(--ink-muted);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .intro-illust {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 24px 0 32px;
  }

  .orb {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: white;
  }

  .orb.teto { background: radial-gradient(circle at 30% 30%, #f29978, #d85a30); }
  .orb.egen { background: radial-gradient(circle at 30% 30%, #b5afef, #7f77dd); }

  .orb-vs {
    font-size: 14px;
    color: var(--ink-muted);
    font-weight: 500;
  }

  /* ===== 성별 선택 ===== */
  .gender-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .gender-btn {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 22px 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
    text-align: center;
    color: var(--ink);
  }

  .gender-btn:hover {
    border-color: var(--ink);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .gender-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
  }

  .gender-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }

  .gender-sub {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ===== 진행 바 ===== */
  .progress-wrap { margin-bottom: 28px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--ink-muted);
  }

  .progress-count {
    font-weight: 600;
    color: var(--ink);
  }

  .progress-bar {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teto), var(--egen));
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  /* ===== 질문 ===== */
  .q-number {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .q-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    text-align: left;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option:hover {
    border-color: var(--ink);
    background: var(--hover-bg);
    transform: translateX(2px);
  }

  .option-marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
    transition: all 0.15s ease;
  }

  .option:hover .option-marker {
    border-color: var(--ink);
    color: var(--ink);
  }

  .nav-row {
    display: flex;
    justify-content: flex-start;
    margin-top: 24px;
  }

  .back-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    padding: 8px 0;
    transition: color 0.15s;
  }

  .back-btn:hover { color: var(--ink); }
  .back-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ===== 결과 ===== */
  .result-tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .result-tag.teto { color: var(--teto-deep); }
  .result-tag.egen { color: var(--egen-deep); }

  .result-title {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 8px;
    letter-spacing: -0.03em;
  }

  .result-title.teto { color: var(--teto-deep); }
  .result-title.egen { color: var(--egen-deep); }

  .result-subtitle {
    font-size: 15px;
    color: var(--ink-muted);
    margin-bottom: 24px;
  }

  .result-visual {
    height: 140px;
    border-radius: 14px;
    margin: 24px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .result-visual.teto {
    background: linear-gradient(135deg, var(--teto-grad-a) 0%, var(--teto-grad-b) 100%);
  }

  .result-visual.egen {
    background: linear-gradient(135deg, var(--egen-grad-a) 0%, var(--egen-grad-b) 100%);
  }

  .result-emoji { font-size: 64px; }

  .result-section { margin-bottom: 22px; }

  .result-section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 10px;
  }

  .result-desc {
    font-size: 15px;
    color: var(--ink);
    line-height: 1.7;
  }

  .traits {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .trait {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 500;
  }

  .trait.teto { background: var(--teto-soft); color: var(--teto-deep); }
  .trait.egen { background: var(--egen-soft); color: var(--egen-deep); }

  .score-bar-wrap { margin-top: 8px; }

  .score-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .score-labels .left { color: var(--teto-deep); }
  .score-labels .right { color: var(--egen-deep); }

  .score-bar {
    height: 10px;
    background: var(--line);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teto) 0%, var(--egen) 100%);
    border-radius: 999px;
  }

  .score-marker {
    position: absolute;
    top: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--ink);
    transform: translateX(-50%);
    transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .compat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .compat-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }

  .compat-card-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .compat-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .compat-desc {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
  }

  /* ===== 버튼 ===== */
  .btn {
    display: inline-block;
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
  }

  .btn-secondary:hover { border-color: var(--ink); }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 28px;
  }

  /* ===== 푸터 노트 ===== */
  .note {
    font-size: 11px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 18px;
    line-height: 1.6;
  }

  /* ===== 푸터 ===== */
  .footer {
    margin-top: 32px;
    padding: 20px 8px 0;
    text-align: center;
    border-top: 1px solid var(--line);
    color: var(--ink-muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .footer-brand {
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    font-size: 13px;
  }

  .footer-brand .footer-domain {
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 12px;
  }

  .footer-links {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .footer-links a, .footer-links span {
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 11px;
  }

  .footer-links a:hover { color: var(--ink); }

  @media (max-width: 480px) {
    .screen { padding: 28px 22px; }
    .intro-title { font-size: 24px; }
    .result-title { font-size: 32px; }
    .q-text { font-size: 18px; }
    .compat-row { grid-template-columns: 1fr; }
    .brand-domain { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ====== 상단 컨트롤바: 브랜드 + 테마 + 언어 ====== -->
  <div class="topbar">
    <a href="/" class="brand" aria-label="teto-egen-test.me home">
      <span class="brand-mark">T·E</span>
      <span>teto-egen-test<span class="brand-domain">.me</span></span>
    </a>
    <div class="topbar-right">
      <button id="langBtn" class="icon-btn" onclick="toggleLang()" aria-label="Toggle language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="langLabel">EN</span>
      </button>
      <button id="themeBtn" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="themeIcon"></span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </div>

  <!-- ====== 인트로 화면 ====== -->
  <section id="screen-intro" class="screen">
    <span class="intro-tag" data-i18n="intro.tag">Personality Test</span>
    <h1 class="intro-title" data-i18n-html="intro.title"></h1>
    <p class="intro-desc" data-i18n="intro.desc"></p>

    <div class="intro-illust">
      <div class="orb teto" data-i18n="intro.orbTeto">테토</div>
      <span class="orb-vs">vs</span>
      <div class="orb egen" data-i18n="intro.orbEgen">에겐</div>
    </div>

    <p style="font-size:14px; font-weight:600; margin-bottom:12px; color:var(--ink);" data-i18n="intro.selectGender"></p>
    <div class="gender-row">
      <button class="gender-btn" onclick="selectGender('male')">
        <span class="gender-icon">👦</span>
        <div class="gender-label" data-i18n="intro.male"></div>
        <div class="gender-sub" data-i18n="intro.maleSub"></div>
      </button>
      <button class="gender-btn" onclick="selectGender('female')">
        <span class="gender-icon">👧</span>
        <div class="gender-label" data-i18n="intro.female"></div>
        <div class="gender-sub" data-i18n="intro.femaleSub"></div>
      </button>
    </div>

    <p class="note" data-i18n-html="intro.note"></p>
  </section>

  <!-- ====== 질문 화면 ====== -->
  <section id="screen-quiz" class="screen hidden">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span data-i18n="quiz.title"></span>
        <span><span id="qCurrent" class="progress-count">1</span> / <span id="qTotal">12</span></span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="q-number" id="qNumber">Q1.</div>
    <h2 class="q-text" id="qText"></h2>
    <div class="options" id="optionsBox"></div>

    <div class="nav-row">
      <button id="backBtn" class="back-btn" onclick="goBack()" data-i18n="quiz.back"></button>
    </div>
  </section>

  <!-- ====== 결과 화면 ====== -->
  <section id="screen-result" class="screen hidden">
    <span id="resultTag" class="result-tag"></span>
    <h1 id="resultTitle" class="result-title"></h1>
    <p id="resultSubtitle" class="result-subtitle"></p>

    <div id="resultVisual" class="result-visual">
      <span id="resultEmoji" class="result-emoji">🔥</span>
    </div>

    <div class="result-section">
      <div class="result-section-title" data-i18n="result.scoreTitle"></div>
      <div class="score-bar-wrap">
        <div class="score-labels">
          <span class="left" data-i18n="result.tetoLabel"></span>
          <span class="right" data-i18n="result.egenLabel"></span>
        </div>
        <div class="score-bar">
          <div id="scoreFill" class="score-fill" style="width:50%;"></div>
          <div id="scoreMarker" class="score-marker" style="left:50%;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--ink-muted); margin-top:6px;">
          <span id="tetoPct">50%</span>
          <span id="egenPct">50%</span>
        </div>
      </div>
    </div>

    <div class="result-section">
      <div class="result-section-title" data-i18n="result.summaryTitle"></div>
      <p id="resultDesc" class="result-desc"></p>
    </div>

    <div class="result-section">
      <div class="result-section-title" data-i18n="result.traitsTitle"></div>
      <div id="resultTraits" class="traits"></div>
    </div>

    <div class="result-section">
      <div class="result-section-title" data-i18n="result.detailTitle"></div>
      <p id="resultDetail" class="result-desc"></p>
    </div>

    <div class="result-section">
      <div class="result-section-title" data-i18n="result.compatTitle"></div>
      <div class="compat-row">
        <div class="compat-card">
          <div class="compat-card-header" data-i18n="result.compatLike"></div>
          <div id="compatLikeName" class="compat-name"></div>
          <div id="compatLikeDesc" class="compat-desc"></div>
        </div>
        <div class="compat-card">
          <div class="compat-card-header" data-i18n="result.compatAvoid"></div>
          <div id="compatAvoidName" class="compat-name"></div>
          <div id="compatAvoidDesc" class="compat-desc"></div>
        </div>
      </div>

/* ===== 상태 ===== */
let state = {
  gender: null,
  index: 0,
  answers: [],
  lang: 'ko',
  theme: 'light'
};

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function t() { return I18N[state.lang]; }

const screens = ['screen-intro', 'screen-quiz', 'screen-result'];
function show(id) {
  screens.forEach(s => $(s).classList.add('hidden'));
  $(id).classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== 테마 토글 ===== */
function applyTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  $('themeIcon').innerHTML = theme === 'dark'
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
    : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  $('themeLabel').textContent = theme === 'dark'
    ? (state.lang === 'ko' ? '라이트' : 'Light')
    : (state.lang === 'ko' ? '다크' : 'Dark');
}

function toggleTheme() {
  applyTheme(state.theme === 'light' ? 'dark' : 'light');
}

/* ===== 언어 토글 ===== */
function applyLang(lang) {
  state.lang = lang;
  document.documentElement.setAttribute('lang', lang);
  document.title = t().pageTitle;
  $('langLabel').textContent = lang === 'ko' ? 'EN' : '한국어';

  // data-i18n: textContent 치환
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = key.split('.').reduce((o, k) => o && o[k], t());
    if (val !== undefined) el.textContent = val;
  });
  // data-i18n-html: innerHTML 치환 (br/span 등 허용)
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    const val = key.split('.').reduce((o, k) => o && o[k], t());
    if (val !== undefined) el.innerHTML = val;
  });

  // 테마 라벨도 언어 따라 갱신
  applyTheme(state.theme);

  // 진행 중인 화면이 퀴즈/결과면 다시 렌더링
  if (!$('screen-quiz').classList.contains('hidden')) {
    renderQuestion();
  } else if (!$('screen-result').classList.contains('hidden')) {
    renderResult();
  }
}

function toggleLang() {
  applyLang(state.lang === 'ko' ? 'en' : 'ko');
}

/* ===== 1. 성별 선택 ===== */
function selectGender(g) {
  state.gender = g;
  state.index = 0;
  state.answers = [];
  show('screen-quiz');
  renderQuestion();
}

/* ===== 2. 질문 렌더링 (옵션 셔플) ===== */
function renderQuestion() {
  const i = state.index;
  const questions = t().questions;
  const q = questions[i];

  $('qCurrent').textContent = i + 1;
  $('qTotal').textContent = questions.length;
  $('progressFill').style.width = (i / questions.length * 100) + '%';
  $('qNumber').textContent = `Q${i + 1}.`;
  $('qText').textContent = q.q;

  const shuffled = shuffle(q.options);
  const box = $('optionsBox');
  box.innerHTML = '';
  shuffled.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    const marker = document.createElement('span');
    marker.className = 'option-marker';
    marker.textContent = String.fromCharCode(65 + idx);
    const text = document.createElement('span');
    text.textContent = opt.text;
    btn.appendChild(marker);
    btn.appendChild(text);
    btn.onclick = () => answer(opt.score);
    box.appendChild(btn);
  });

  $('backBtn').disabled = (i === 0);
}

/* ===== 3. 답변 처리 ===== */
function answer(score) {
  state.answers[state.index] = score;
  const total = t().questions.length;
  if (state.index < total - 1) {
    state.index++;
    renderQuestion();
  } else {
    $('progressFill').style.width = '100%';
    setTimeout(() => { show('screen-result'); renderResult(); }, 350);
  }
}

/* ===== 4. 이전 ===== */
function goBack() {
  if (state.index > 0) {
    state.index--;
    renderQuestion();
  }
}

/* ===== 5. 결과 렌더링 (T:+1, E:+1, N:+0.5/+0.5) ===== */
function renderResult() {
  let tScore = 0, eScore = 0;
  state.answers.forEach(a => {
    if (a === 'T') tScore += 1;
    else if (a === 'E') eScore += 1;
    else if (a === 'N') { tScore += 0.5; eScore += 0.5; }
  });
  const total = tScore + eScore || 1;
  const tPct = Math.round((tScore / total) * 100);
  const ePct = 100 - tPct;
  const isTeto = tScore >= eScore;

  const key = (isTeto ? 'teto_' : 'egen_') + state.gender;
  const r = t().results[key];
  const genderLabel = state.gender === 'male' ? t().result.genderMale : t().result.genderFemale;

  $('resultTag').textContent = t().result.tagPrefix + genderLabel;
  $('resultTag').className = 'result-tag ' + r.type;
  $('resultTitle').textContent = r.title;
  $('resultTitle').className = 'result-title ' + r.type;
  $('resultSubtitle').textContent = r.subtitle;
  $('resultVisual').className = 'result-visual ' + r.type;
  $('resultEmoji').textContent = r.emoji;
  $('resultDesc').textContent = r.summary;
  $('resultDetail').textContent = r.detail;

  $('scoreMarker').style.left = ePct + '%';
  $('tetoPct').textContent = (state.lang === 'ko' ? '테토 ' : 'Teto ') + tPct + '%';
  $('egenPct').textContent = (state.lang === 'ko' ? '에겐 ' : 'Egen ') + ePct + '%';

  const traits = $('resultTraits');
  traits.innerHTML = '';
  r.traits.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'trait ' + r.type;
    span.textContent = '#' + tag;
    traits.appendChild(span);
  });

  $('compatLikeName').textContent = r.likeName;
  $('compatLikeDesc').textContent = r.likeDesc;
  $('compatAvoidName').textContent = r.avoidName;
  $('compatAvoidDesc').textContent = r.avoidDesc;
}

/* ===== 6. 다시하기 / 공유 ===== */
function restart() {
  state.gender = null;
  state.index = 0;
  state.answers = [];
  show('screen-intro');
}

function shareResult() {
  const title = $('resultTitle').textContent;
  const summary = $('resultDesc').textContent;
  const text = `${t().result.shareTextPrefix} "${title}"!\n${summary}`;

  if (navigator.share) {
    navigator.share({ title: t().pageTitle, text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert(t().result.shareCopied);
    });
  } else {
    alert(text);
  }
}

/* ===== 초기화 ===== */
(function init() {
  // OS의 다크모드 선호 감지
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme = prefersDark ? 'dark' : 'light';

  // 브라우저 언어 감지 (한국어가 아니면 영어로)
  const browserLang = (navigator.language || 'ko').toLowerCase();
  applyLang(browserLang.startsWith('ko') ? 'ko' : 'en');
  // applyLang 내부에서 applyTheme도 호출됨
})();
</script>
